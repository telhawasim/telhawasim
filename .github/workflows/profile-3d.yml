name: Generate 3D Contribution Graph

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-3d.yml
  workflow_dispatch:

  schedule:
    - cron: "45 2 * * *"

permissions:
  contents: write

concurrency:
  group: contribution-3d
  cancel-in-progress: false

jobs:
  generate-3d:
    name: Generate 3D Profile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: telhawasim

      - name: Commit generated images
        run: |
          test -s profile-3d-contrib/profile-night-rainbow.svg

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-3d-contrib/

          if ! git diff --cached --quiet; then
            git commit -m "chore: update 3D contributions"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
